<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Profile - Flight Game</title>
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="terminal profile-container">
    <h1>ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM</h1>
    <h2>-- FLIGHT OPERATIONS LOGIN TERMINAL --</h2>

    <div class="section">
      <label>> SELECT EXISTING PROFILE:</label>
      <select id="existing-user">
        <option value="">-- Select Profile --</option>
        <option value="captain_lee">Captain Lee</option>
        <option value="pilot_vega">Pilot Vega</option>
        <option value="cmdr_kowalski">Cmdr Kowalski</option>
      </select>
      <button onclick="startGameFromSelection()">[ LOAD PROFILE ]</button>
    </div>

    <div class="divider"></div>

    <div class="section">
      <label>> CREATE NEW PROFILE:</label>
      <input type="text" id="new-user" placeholder="Enter new username">
      <button onclick="startGameFromNew()">[ CREATE + START ]</button>
    </div>
  </div>

  <script>
    function startGameFromSelection() {
      const selected = document.getElementById("existing-user").value;
      if (selected) {
        window.location.href = `index.html?user=${encodeURIComponent(selected)}`;
      } else {
        alert("Please select a profile.");
      }
    }

    function startGameFromNew() {
      const newUser = document.getElementById("new-user").value.trim();
      if (newUser) {
        window.location.href = `index.html?user=${encodeURIComponent(newUser)}`;
      } else {
        alert("Please enter a username.");
      }
    }
  </script>
</body>
</html>
