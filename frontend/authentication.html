<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Valitse profiili - Miehen Salainen Matka</title>
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="terminal profile-container">
    <h1>MIEHEN SALAINEN MATKA</h1>
    <h2>-- THAIMAA --</h2>

    <div class="section">
      <label>> VALITSE OLEMASA OLEVA PELAAJA:</label>
      <select id="existing-user">
        <option value="">-- Valitse pelaaja --</option>
      </select>
      <button id="btn-load">[ ALOITA ]</button>
    </div>

    <div class="divider"></div>

    <div class="section">
      <label>> LUO UUSI PELAAJA:</label>
      <input type="text" id="new-user" placeholder="Syötä käyttäjänimi">
      <button id="btn-create">[ LUO JA ALOITA ]</button>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
