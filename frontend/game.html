<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Lentokone - Miehen salainen matka</title>
  <link rel="stylesheet" href="game.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>
  <div class="container">

    <div class="chat-box terminal" id="chat">
      <div class="title">[VIESTIT - VAIMO]</div>
      <div id="chat-log" class="terminal-list">
        <div class="viesti">> Hyvää työmatkaa rakas!</div>
      </div>
    </div>

    <div class="map terminal" id="world-map">
      <div class="title">[WORLD MAP]</div>
    </div>

    <div class="control-panel terminal">
      <div class="title">[ SYSTEM MENU ]</div>
      <div class="terminal-list"> 
        <div class="confirm-button" onclick="lisaaJonoon(() => aloitaPeliUudestaan())">Aloita alusta</div>
        <div class="confirm-button" onclick="kirjauduUlos()">Kirjaudu ulos</div>
      </div>
    </div>
    

    <div class="player-stats terminal">
      <div class="title">[PELAAJAN TIEDOT]</div>
      <div id="stat-name">> Nimi: ...</div>
      <div id="stat-location">> Sijainti: ...</div>
      <div id="stat-co2-budget">> CO2 budjetti: ...</div>
      <div id="stat-distance">> Lennettymatka: ...</div>
      <div id="stat-time">> Lentoaika: ...</div>
      <div id="stat-time">> Määränpää: Thaimaa</div>
    </div>

    <div class="player-image terminal">
      <div class="title">[PELAAJAN KAMERA]</div>

      <!-- Placeholdereita -->
      <img src="https://i.imgflip.com/2e9dse.jpg" alt="">
    </div>

    <div class="terminal flight-computer" id="flight-computer">
      <div class="title">[ FLIGHT COMPUTER ]</div>
      <div id="terminal-question"></div>
      <div class="dashes"></div>
      <div id="flight-options" class="terminal-list">
      </div>
      <div class="dashes"></div>
      <div class="terminal-input">
        > <span id="flight-destination">_</span>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="viestit.js"></script>
  <script src="game.js"></script>
</body>

</html>
